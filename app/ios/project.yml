name: ScavRelayApp
options:
  bundleIdPrefix: com.noahhova
  deploymentTarget:
    iOS: "17.2"
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  ScavRelay:
    type: application
    platform: iOS
    sources:
      - path: ScavRelay
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noahhova.scavrelay
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ScavRelay/Info.plist
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice
      - package: MetaWearablesDAT
        product: MWDATInputs
schemes:
  ScavRelay:
    build:
      targets:
        ScavRelay: all
